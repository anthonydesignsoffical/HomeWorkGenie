<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Homework Genie | Admin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#07152e;--navy2:#0d2143;--purple:#7447e8;--purple2:#8b5cf6;--ink:#182033;--muted:#738096;--bg:#f6f8fc;--line:#e8ecf3;--white:#fff;--green:#14b87a;--orange:#f59e0b;--red:#ef4444;--blue:#2563eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito Sans",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{display:flex;min-height:100vh}.side{width:252px;background:var(--navy);color:#dce7fb;position:fixed;inset:0 auto 0 0;padding:24px 14px;overflow:auto}.brand{display:flex;align-items:center;gap:10px;padding:0 12px 28px}.brand-mark{width:42px;height:42px;border-radius:13px;background:#050406;display:grid;place-items:center;font-size:24px}.brand strong{font-family:Fredoka;font-size:20px;line-height:1}.brand span{color:#a78bfa}.group{margin:14px 0 22px}.group-title{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#7e91b1;padding:0 13px 8px;font-weight:800}.nav{display:flex;gap:11px;align-items:center;padding:11px 13px;border-radius:10px;color:#bdcbe2;background:transparent;border:0;width:100%;text-align:left}.nav:hover,.nav.active{background:rgba(124,58,237,.2);color:#fff}.nav .ico{width:20px;text-align:center}.count{margin-left:auto;min-width:22px;padding:2px 6px;border-radius:9px;background:#33466a;color:#fff;font-size:10px;text-align:center}.nav.active .count{background:#7c3aed}.logout{margin-top:20px;color:#ff7d7d}.main{margin-left:252px;flex:1}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 30px;position:sticky;top:0;z-index:10}.hamb{border:0;background:transparent;font-size:23px;color:#61708b}.search{margin-left:auto;width:min(350px,35vw);padding:11px 15px;border:1px solid var(--line);border-radius:10px;outline:none}.avatar{width:38px;height:38px;border-radius:50%;background:#eee8ff;color:#6336ce;display:grid;place-items:center;font-weight:800}.admin-name{font-weight:800}.wrap{padding:28px 30px;max-width:1600px;margin:auto}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}.head h1{font-family:Fredoka;margin:0;font-size:30px}.head p{margin:5px 0;color:var(--muted)}.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:800}.btn.primary{background:var(--purple);color:#fff}.btn.secondary{background:#fff;border:1px solid var(--line);color:#42506a}.btn.danger{background:#fff0f0;color:#c53030}.stats{display:grid;grid-template-columns:repeat(6,minmax(150px,1fr));gap:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px;box-shadow:0 4px 18px rgba(20,31,55,.035)}.stat-top{display:flex;justify-content:space-between}.stat-icon{width:37px;height:37px;border-radius:11px;display:grid;place-items:center;background:#f0eaff}.stat .num{font-size:26px;font-weight:800;margin-top:9px}.stat small{color:var(--muted)}.grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(320px,.8fr);gap:18px;margin-top:18px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 18px rgba(20,31,55,.035);overflow:hidden}.card-head{display:flex;justify-content:space-between;align-items:center;padding:17px 18px;border-bottom:1px solid var(--line)}.card-head h2{font-family:Fredoka;font-size:18px;margin:0}.card-head small{color:var(--muted)}.card-body{padding:0 18px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th{color:#78859b;text-transform:uppercase;font-size:10px;letter-spacing:.7px;text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);white-space:nowrap}.table td{padding:13px 8px;border-bottom:1px solid #f0f2f6;vertical-align:middle}.table tr:last-child td{border-bottom:0}.person{display:flex;align-items:center;gap:9px}.mini{width:30px;height:30px;border-radius:50%;background:#e9e4ff;color:#6541d0;display:grid;place-items:center;font-weight:800;font-size:11px}.muted{color:var(--muted);font-size:11px}.pill{display:inline-flex;padding:5px 8px;border-radius:8px;font-size:10px;font-weight:800;text-transform:uppercase;white-space:nowrap}.pill.new{background:#efe7ff;color:#6d3bd2}.pill.review{background:#e6f0ff;color:#2563eb}.pill.quoted{background:#ddf8ed;color:#087c54}.pill.paid{background:#def8ec;color:#087c54}.pill.pending{background:#fff1d7;color:#a36200}.pill.progress{background:#e5f0ff;color:#2457b7}.pill.overdue{background:#ffe4e4;color:#c42f2f}.attention-row,.payment-row,.notification-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #f0f2f6}.attention-row:last-child,.payment-row:last-child,.notification-row:last-child{border-bottom:0}.dot{width:9px;height:9px;border-radius:50%;background:#8b5cf6}.attention-row .grow,.notification-row .grow{flex:1}.right-stack{display:flex;flex-direction:column;gap:18px}.chart{height:210px;padding:16px 18px;display:flex;align-items:flex-end;gap:10px}.bar{flex:1;position:relative;min-width:20px}.bar i{display:block;background:var(--purple);border-radius:7px 7px 2px 2px;min-height:8px}.bar span{display:block;text-align:center;color:#8994a8;font-size:10px;margin-top:6px}.bar b{position:absolute;top:-19px;width:100%;text-align:center;font-size:10px}.empty{padding:35px;text-align:center;color:var(--muted)}.login-screen{position:fixed;inset:0;background:var(--navy);display:grid;place-items:center;z-index:50}.login-box{width:min(430px,92vw);background:#fff;border-radius:18px;padding:32px;box-shadow:0 30px 90px rgba(0,0,0,.3)}.login-box h1{font-family:Fredoka;margin:0 0 6px}.login-box p{color:var(--muted);margin-top:0}.field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:#8b5cf6;box-shadow:0 0 0 3px #8b5cf622}.error{color:#c53030;background:#fff1f1;border-radius:8px;padding:9px;font-size:12px;display:none}.modal{position:fixed;inset:0;background:rgba(5,14,30,.55);display:none;align-items:center;justify-content:center;padding:22px;z-index:30}.modal.open{display:flex}.modal-box{background:#fff;border-radius:16px;width:min(980px,96vw);max-height:92vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}.modal-head h2{font-family:Fredoka;margin:0}.close{border:0;background:transparent;font-size:25px}.detail{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:20px}.detail .full{grid-column:1/-1}.detail-box{border:1px solid var(--line);border-radius:10px;padding:13px}.detail-box label{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;font-weight:800;margin-bottom:5px}.files{display:flex;gap:8px;flex-wrap:wrap}.file{border:1px solid var(--line);background:#fafbfe;padding:8px 10px;border-radius:8px;font-size:12px}.quote-form{border-top:1px solid var(--line);padding:20px}.quote-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}.hidden{display:none!important}@media(max-width:1150px){.stats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:800px){.side{width:72px;padding:18px 8px}.brand strong,.group-title,.nav span:not(.ico),.count{display:none}.brand{padding:0 6px 25px}.main{margin-left:72px}.wrap{padding:20px 15px}.top{padding:0 15px}.search{width:180px}.stats{grid-template-columns:repeat(2,1fr)}.detail,.quote-grid{grid-template-columns:1fr}.detail .full{grid-column:auto}}@media(max-width:500px){.stats{grid-template-columns:1fr}.admin-name{display:none}.search{width:130px}}

<style>
/* Homework Genie admin refresh: flat plum, cream and gold palette. */
:root{--navy:#24152b;--navy2:#160d1b;--purple:#d6a83a;--purple2:#bd8f25;--ink:#241d29;--muted:#746a77;--bg:#f8f5ef;--line:#e4ddd1;--white:#fff;--green:#17815d;--orange:#b87516;--red:#b23a3a;--blue:#76540c}
.ui-icon{width:1.1em;height:1.1em;display:inline-block;vertical-align:-.16em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.side{background:var(--navy);border-right:1px solid rgba(241,212,122,.14)}
.brand-mark{background:#050406;border:1px solid #8f6d22;display:grid;place-items:center;overflow:hidden}
.brand-mark img{width:100%;height:100%;object-fit:cover}
.nav:hover,.nav.active{background:#34203d;color:#fff}
.nav.active .count{background:var(--purple);color:#1d1422}
.btn.primary{background:var(--purple);color:#1d1422}
.btn.primary:hover{background:var(--purple2)}
.login-screen{background:var(--navy)}
.login-box{box-shadow:0 18px 50px rgba(0,0,0,.24);border:1px solid #eadfc9}

/* Production visual polish */
.brand img { object-fit:contain; background:transparent; }
.btn-outline { background:#d6a83a !important; border-color:#d6a83a !important; color:#1d1422 !important; }
.btn-outline:hover { background:#bd8f25 !important; border-color:#bd8f25 !important; color:#fff !important; }
/* Mobile dashboard */
.hamb{display:none}
.side-backdrop{display:none}
@media(max-width:800px){
  .hamb{display:block;padding:6px 10px;border-radius:8px;color:#241d29}
  .side{width:270px;padding:24px 14px;transform:translateX(-102%);transition:transform .3s ease;z-index:40}
  body.nav-open .side{transform:none}
  body.nav-open{overflow:hidden}
  body.nav-open .side-backdrop{display:block;position:fixed;inset:0;background:rgba(10,5,14,.55);z-index:35}
  .side .brand{padding:0 12px 28px}
  .side .brand strong{display:inline}
  .side .group-title{display:block}
  .side .nav span:not(.ico){display:inline}
  .side .count{display:inline-block}
  .main{margin-left:0}
  .top{height:64px;padding:0 12px;gap:10px}
  .search{flex:1;width:auto;min-width:0;margin-left:0}
  .wrap{padding:16px 12px}
  .head{flex-wrap:wrap;gap:12px}
  .head h1{font-size:24px}
  .card-head{flex-wrap:wrap;gap:8px}
  .table{min-width:620px}
  .attention-row,.payment-row,.notification-row{flex-wrap:wrap}
  .modal{padding:8px}
  .modal-box{width:100%;max-height:96vh}
  .detail,.quote-form{padding:14px}
  .modal-actions{flex-wrap:wrap}
  .modal-actions .btn{flex:1 1 140px}
}
@media(max-width:500px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .stat{padding:13px}
  .stat .num{font-size:22px}
  .top .avatar + div{display:none}
}
</style>
</style>
</head>
<body>
<div id="loginScreen" class="login-screen"><div class="login-box"><div class="brand" style="padding:0 0 20px;color:#172033"><div class="brand-mark"><img src="/assets/homework-genie-logo-transparent.png" alt=""></div><strong>HOMEWORK <span>GENIE</span></strong></div><h1>Admin Sign In</h1><p>Sign in to manage requests, assignments, quotes and payments.</p><div class="field"><label>Email</label><input id="loginEmail" type="email" value="hwgenie@proton.me" autocomplete="username"></div><div class="field"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password"></div><div id="loginError" class="error"></div><button class="btn primary" style="width:100%;margin-top:5px" onclick="adminLogin()">Sign in</button></div></div>
<div id="app" class="shell hidden">
<aside class="side"><div class="brand"><div class="brand-mark"><img src="/assets/homework-genie-logo-transparent.png" alt=""></div><strong>HOMEWORK <span>GENIE</span></strong></div>
<div class="group"><div class="group-title">Overview</div><button class="nav active" data-view="dashboard"><span class="ico">⌂</span><span>Dashboard</span></button></div>
<div class="group"><div class="group-title">Management</div><button class="nav" data-view="requests"><span class="ico"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8M8 17h6"/></svg></span><span>Quote Requests</span><b id="requestCount" class="count">0</b></button><button class="nav" data-view="assignments"><span class="ico"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg></span><span>Assignments</span><b id="assignmentCount" class="count">0</b></button><button class="nav" data-view="quotes"><span class="ico"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 5h16v11H8l-4 4V5Z"/><path d="M8 9h8M8 12h5"/></svg></span><span>Quotes</span><b id="quoteCount" class="count">0</b></button><button class="nav" data-view="invoices"><span class="ico"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></span><span>Invoices</span><b id="invoiceCount" class="count">0</b></button><button class="nav" data-view="payments"><span class="ico"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></svg></span><span>Payments</span></button></div>
<div class="group"><div class="group-title">Clients</div><button class="nav" data-view="students"><span class="ico"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span><span>Students</span></button><button class="nav" data-view="requests"><span class="ico"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span><span>Guest Leads</span></button></div>
<div class="group"><div class="group-title">Communication</div><button class="nav" data-view="notifications"><span class="ico"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg></span><span>Notifications</span></button></div>
<button class="nav logout" onclick="logout()"><span class="ico"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10 17l5-5-5-5M15 12H3M21 19V5a2 2 0 0 0-2-2h-6"/></svg></span><span>Logout</span></button>
</aside>
<main class="main"><header class="top"><button class="hamb">☰</button><input id="globalSearch" class="search" placeholder="Search anywhere..." oninput="renderCurrent()"><div class="avatar">A</div><div><div class="admin-name">Admin</div><div class="muted">Super Administrator</div></div></header>
<div class="wrap" id="content"></div></main></div>
<div id="requestModal" class="modal" onclick="backdrop(event)"><div class="modal-box"><div class="modal-head"><div><h2 id="modalTitle">Request</h2><div id="modalSub" class="muted"></div></div><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<script>
let state={}; let view='dashboard';
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function money(n){return '$'+Number(n||0).toFixed(2)}
function initials(n){return String(n||'HG').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()}
function statusPill(s){const map={request_received:['new','NEW'],under_review:['review','REVIEW'],quote_sent:['quoted','QUOTED'],pending_payment:['pending','PENDING'],paid:['paid','PAID'],in_progress:['progress','IN PROGRESS'],quality_check:['progress','QUALITY CHECK'],completed:['paid','COMPLETED'],overdue:['overdue','OVERDUE']};const x=map[s]||['review',s||'UNKNOWN'];return `<span class="pill ${x[0]}">${esc(x[1])}</span>`}
async function api(path,opt={}){const r=await fetch('/api'+path,{credentials:'same-origin',...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
async function adminLogin(){const email=$('loginEmail').value.trim(),password=$('loginPassword').value;try{await api('/auth/admin-login',{method:'POST',body:JSON.stringify({email,password})});$('loginError').style.display='none';$('loginScreen').classList.add('hidden');$('app').classList.remove('hidden');await load();}catch(e){$('loginError').textContent=e.message;$('loginError').style.display='block'}}
async function logout(){await api('/auth/logout',{method:'POST'}).catch(()=>{});location.reload()}
async function load(){const d=await api('/admin/dashboard');state=d;['requestCount','assignmentCount','quoteCount','invoiceCount'].forEach((id,i)=>$(id).textContent=[d.requests.length,d.assignments.length,d.quotes.length,d.invoices.length][i]);renderCurrent()}
function navSetup(){document.querySelectorAll('.nav[data-view]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.nav[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;renderCurrent()}))}
function renderCurrent(){const q=($('globalSearch').value||'').toLowerCase();if(view==='dashboard')return dashboard();if(view==='requests')return listView('Quote Requests',state.requests.filter(x=>JSON.stringify(x).toLowerCase().includes(q)),true);if(view==='assignments')return listView('Assignments',state.assignments.filter(x=>JSON.stringify(x).toLowerCase().includes(q)),false);if(view==='quotes')return quotesView();if(view==='invoices')return invoicesView();if(view==='payments')return paymentsView();if(view==='students')return studentsView();if(view==='notifications')return notificationsView()}
function dashboard(){const s=state.summary||{};const req=state.requests.slice(0,5),as=state.assignments.slice(0,5),pay=state.payments.slice(0,5);$('content').innerHTML=`<div class="head"><div><h1>Dashboard</h1><p>Welcome back, Admin. Here's what's happening today.</p></div><button class="btn primary" onclick="view='requests';renderCurrent()">＋ New Quote</button></div><div class="stats"><div class="stat"><div class="stat-top"><span>New Requests</span><div class="stat-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8M8 17h6"/></svg></div></div><div class="num">${s.newRequests||0}</div><small>Needs review</small></div><div class="stat"><div class="stat-top"><span>Assignments</span><div class="stat-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg></div></div><div class="num">${s.assignments||0}</div><small>Total submitted</small></div><div class="stat"><div class="stat-top"><span>Pending Quotes</span><div class="stat-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 5h16v11H8l-4 4V5Z"/><path d="M8 9h8M8 12h5"/></svg></div></div><div class="num">${s.pendingQuotes||0}</div><small>Awaiting response</small></div><div class="stat"><div class="stat-top"><span>Pending Invoices</span><div class="stat-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></div></div><div class="num">${s.pendingInvoices||0}</div><small>Awaiting payment</small></div><div class="stat"><div class="stat-top"><span>Payments Received</span><div class="stat-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></svg></div></div><div class="num">${s.paymentsReceived||0}</div><small>Recorded payments</small></div><div class="stat"><div class="stat-top"><span>Needs Attention</span><div class="stat-icon">⚠️</div></div><div class="num">${s.needsAttention||0}</div><small>Items to review</small></div></div><div class="grid"><div><section class="card"><div class="card-head"><h2>Recent Quote Requests</h2><button class="btn secondary" onclick="view='requests';renderCurrent()">View All</button></div><div class="card-body"><div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Service</th><th>Deadline</th><th>Status</th><th></th></tr></thead><tbody>${reqRows(req)}</tbody></table></div></div></section><section class="card" style="margin-top:18px"><div class="card-head"><h2>Recent Assignments</h2><button class="btn secondary" onclick="view='assignments';renderCurrent()">View All</button></div><div class="card-body"><div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Service</th><th>Deadline</th><th>Status</th><th></th></tr></thead><tbody>${assignmentRows(as)}</tbody></table></div></div></section><section class="card" style="margin-top:18px"><div class="card-head"><h2>Requests Overview <small>(Recent activity)</small></h2></div><div class="chart">${[12,18,15,20,22,28,12].map((n,i)=>`<div class="bar"><b>${n}</b><i style="height:${n*5}px"></i><span>${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}</span></div>`).join('')}</div></section></div><div class="right-stack"><section class="card"><div class="card-head"><h2>Needs Attention</h2></div><div class="card-body">${attention()}</div></section><section class="card"><div class="card-head"><h2>Recent Payments</h2><button class="btn secondary" onclick="view='payments';renderCurrent()">View All</button></div><div class="card-body">${pay.length?pay.map(p=>`<div class="payment-row"><div class="grow"><b>${esc(p.reference||p.id.slice(0,8))}</b><div class="muted">${esc(p.method)}</div></div><b>${money(p.amount)}</b>${statusPill(p.status)}</div>`).join(''):'<div class="empty">No payments yet.</div>'}</div></section><section class="card"><div class="card-head"><h2>Notifications</h2><button class="btn secondary" onclick="view='notifications';renderCurrent()">View All</button></div><div class="card-body">${(state.notifications||[]).slice(0,6).map(n=>`<div class="notification-row"><span class="dot"></span><div class="grow"><b>${esc(notificationText(n))}</b><div class="muted">${new Date(n.createdAt).toLocaleString()}</div></div></div>`).join('')||'<div class="empty">No notifications.</div>'}</div></section></div></div>`}
function reqRows(arr){return arr.length?arr.map(r=>`<tr><td><div class="person"><span class="mini">${initials(r.name)}</span><div><b>${esc(r.name)}</b><div class="muted">${esc(r.email)}</div></div></div></td><td>${esc(r.service)}</td><td>${esc(r.deadline)}</td><td>${statusPill(r.status)}</td><td><button class="btn secondary" onclick="openRequest('${r.id}')">Open</button></td></tr>`).join(''):'<tr><td colspan="5"><div class="empty">No quote requests.</div></td></tr>'}
function assignmentRows(arr){return arr.length?arr.map(a=>`<tr><td><div class="person"><span class="mini">${initials(a.student?.name)}</span><div><b>${esc(a.student?.name)}</b><div class="muted">${esc(a.student?.email)}</div></div></div></td><td>${esc(a.service)}</td><td>${esc(a.deadline)}</td><td>${statusPill(a.status)}</td><td><button class="btn secondary" onclick="openRequest('${a.id}')">Open</button></td></tr>`).join(''):'<tr><td colspan="5"><div class="empty">No assignments.</div></td></tr>'}
function listView(title,arr,isRequest){$('content').innerHTML=`<div class="head"><div><h1>${title}</h1><p>${isRequest?'Review guest quote requests and create personalized quotations.':'Manage registered-client assignments and workflow status.'}</p></div></div><section class="card"><div class="card-body"><div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Title</th><th>Service</th><th>Deadline</th><th>Status</th><th>Action</th></tr></thead><tbody>${arr.length?arr.map(x=>{const n=x.name||x.student?.name||'';return `<tr><td><div class="person"><span class="mini">${initials(n)}</span><div><b>${esc(n)}</b><div class="muted">${esc(x.email||x.student?.email)}</div></div></div></td><td>${esc(x.title)}</td><td>${esc(x.service)}</td><td>${esc(x.deadline)}</td><td>${statusPill(x.status)}</td><td><button class="btn secondary" onclick="openRequest('${x.id}')">View details</button></td></tr>`}).join(''):'<tr><td colspan="6"><div class="empty">Nothing to display.</div></td></tr>'}</tbody></table></div></div></section>`}
function attention(){const items=[];const req=[...state.requests,...state.assignments].filter(x=>['request_received','under_review'].includes(x.status)).slice(0,4);req.forEach(x=>items.push(`<div class="attention-row"><span><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8M8 17h6"/></svg></span><div class="grow"><b>${esc(x.title)}</b><div class="muted">Needs review</div></div><button class="btn secondary" onclick="openRequest('${x.id}')">Open</button></div>`));const inv=state.invoices.filter(i=>i.status==='pending_payment').slice(0,3);inv.forEach(x=>items.push(`<div class="attention-row"><span><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></svg></span><div class="grow"><b>${esc(x.invoiceNumber)}</b><div class="muted">${money(x.amount)} awaiting payment</div></div></div>`));return items.join('')||'<div class="empty">Everything is up to date.</div>'}
function quotesView(){$('content').innerHTML=`<div class="head"><div><h1>Quotes</h1><p>Create, review and track quotations.</p></div></div><section class="card"><div class="card-body"><div class="table-wrap"><table class="table"><thead><tr><th>Quote</th><th>Student</th><th>Service</th><th>Total</th><th>Issued</th><th>Status</th></tr></thead><tbody>${state.quotes.map(q=>`<tr><td><b>${esc(q.quoteNumber)}</b></td><td>${esc(q.student?.name)}</td><td>${esc(q.service)}</td><td><b>${money(q.price)}</b></td><td>${new Date(q.dateIssued).toLocaleDateString()}</td><td>${statusPill(q.status)}</td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">No quotes yet.</div></td></tr>'}</tbody></table></div></div></section>`}
function invoicesView(){$('content').innerHTML=`<div class="head"><div><h1>Invoices</h1><p>Track invoice status and record manual payments when needed.</p></div></div><section class="card"><div class="card-body"><div class="table-wrap"><table class="table"><thead><tr><th>Invoice</th><th>Student</th><th>Service</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead><tbody>${state.invoices.map(i=>`<tr><td><b>${esc(i.invoiceNumber)}</b></td><td>${esc(i.email||i.userId)}</td><td>${esc(i.service)}</td><td>${money(i.amount)}</td><td>${statusPill(i.status)}</td><td>${i.status!=='paid'?`<button class="btn secondary" onclick="markPaid('${i.id}')">Mark paid</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">No invoices yet.</div></td></tr>'}</tbody></table></div></div></section>`}
function paymentsView(){$('content').innerHTML=`<div class="head"><div><h1>Payments</h1><p>Recorded payment activity.</p></div></div><section class="card"><div class="card-body"><div class="table-wrap"><table class="table"><thead><tr><th>Reference</th><th>Invoice</th><th>Method</th><th>Amount</th><th>Received</th><th>Status</th></tr></thead><tbody>${state.payments.map(p=>`<tr><td>${esc(p.reference||p.id)}</td><td>${esc(p.invoiceId)}</td><td>${esc(p.method)}</td><td>${money(p.amount)}</td><td>${new Date(p.receivedAt).toLocaleString()}</td><td>${statusPill(p.status)}</td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">No payments yet.</div></td></tr>'}</tbody></table></div></div></section>`}
function studentsView(){const students=state.users||[];$('content').innerHTML=`<div class="head"><div><h1>Students & Leads</h1><p>People currently represented in requests and assignments.</p></div></div><section class="card"><div class="card-body"><div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Type</th></tr></thead><tbody>${students.map(x=>`<tr><td>${esc(x.name||x.student?.name)}</td><td>${esc(x.email||x.student?.email)}</td><td>${esc(x.phone||x.student?.phone)}</td><td>${x.userId?'Registered client':'Guest lead'}</td></tr>`).join('')||'<tr><td colspan="4"><div class="empty">No client records in submitted work yet.</div></td></tr>'}</tbody></table></div></div></section>`}
function notificationText(n){const d=n.data||{};return ({new_quote_request:`New quote request from ${d.name||'guest'}`,new_assignment:`Assignment submitted by ${d.student||'student'}`,quote_sent:`Quote ${d.quoteNumber||''} sent`,quote_accepted:`Quote accepted`,payment_received:`Payment received`,status_update:`Request status updated to ${d.status||''}`,password_reset_requested:'Password reset requested'}[n.type]||n.type)}
function notificationsView(){$('content').innerHTML=`<div class="head"><div><h1>Notifications</h1><p>Recent system and workflow events.</p></div></div><section class="card"><div class="card-body">${(state.notifications||[]).map(n=>`<div class="notification-row"><span class="dot"></span><div class="grow"><b>${esc(notificationText(n))}</b><div class="muted">${new Date(n.createdAt).toLocaleString()}</div></div></div>`).join('')||'<div class="empty">No notifications.</div>'}</div></section>`}
async function openRequest(id){try{const d=await api('/admin/requests/'+id);const x=d.item;const files=(x.files||[]).map(f=>`<button class="file" onclick="downloadFile('${f.id}','${esc(f.name)}')"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m21.4 11.6-8.9 8.9a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 1 1-2.8-2.8l8.5-8.5"/></svg> ${esc(f.name)}</button>`).join('')||'<span class="muted">No files</span>';$('modalTitle').textContent=x.title;$('modalSub').textContent=(x.name||x.student?.name||'')+' • '+(x.email||x.student?.email||'');$('modalBody').innerHTML=`<div class="detail"><div class="detail-box"><label>Service</label>${esc(x.service)}</div><div class="detail-box"><label>Subject / Course</label>${esc(x.subject)}</div><div class="detail-box"><label>Deadline</label>${esc(x.deadline)}</div><div class="detail-box"><label>Length / Budget</label>${esc(x.length||x.budget||'Not specified')}</div><div class="detail-box full"><label>Description</label>${esc(x.description||x.details)}</div><div class="detail-box full"><label>Additional Instructions</label>${esc(x.instructions||'None')}</div><div class="detail-box full"><label>Files</label><div class="files">${files}</div></div></div><div class="quote-form"><h2 style="font-family:Fredoka;margin-top:0">Create Quote</h2><div class="quote-grid"><div class="field"><label>Base Price (USD)</label><input id="basePrice" type="number" min="0" step="0.01" placeholder="0.00"></div><div class="field"><label>Additional Charges (USD)</label><input id="extraPrice" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Quote Expiry</label><input id="expiryDate" type="date"></div><div class="field"><label>Update Status</label><select id="statusSelect"><option value="request_received">Request Received</option><option value="under_review">Under Review</option><option value="quote_sent">Quote Sent</option><option value="payment_pending">Payment Pending</option><option value="in_progress">In Progress</option><option value="quality_check">Quality Check</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></div><div class="field" style="grid-column:1/-1"><label>Terms / Notes</label><textarea id="terms" rows="4" placeholder="Add terms, scope, delivery notes or other client-facing information."></textarea></div></div><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Close</button><button class="btn secondary" onclick="updateStatus('${x.id}')">Save Status</button><button class="btn primary" onclick="createQuote('${x.id}')">Create & Send Quote</button></div></div>`;$('statusSelect').value=x.status||'request_received';$('requestModal').classList.add('open')}catch(e){alert(e.message)}}
async function createQuote(id){const base=Number($('basePrice').value),extra=Number($('extraPrice').value||0);if(!Number.isFinite(base)||base<0||!Number.isFinite(extra)||extra<0)return alert('Enter valid quote amounts.');try{const d=await api('/admin/quotes',{method:'POST',body:JSON.stringify({requestId:id,basePrice:base,additionalCharges:extra,expiryDate:$('expiryDate').value||null,terms:$('terms').value})});closeModal();await load();if(d.guestQuoteToken){const link=location.origin+'/guest-quote.html?token='+encodeURIComponent(d.guestQuoteToken);prompt('Guest quote created. Copy this secure quote link and send it to the client:',link)}else{alert('Quote created and sent to the registered client.')}}catch(e){alert(e.message)}}
async function updateStatus(id){try{await api('/admin/requests/'+id+'/status',{method:'POST',body:JSON.stringify({status:$('statusSelect').value})});closeModal();await load()}catch(e){alert(e.message)}}
async function markPaid(id){const reference=prompt('Payment reference (optional):')??'';try{await api('/admin/payments',{method:'POST',body:JSON.stringify({invoiceId:id,method:'manual',reference})});await load();alert('Invoice marked paid.')}catch(e){alert(e.message)}}
async function downloadFile(id,name){try{const r=await fetch('/api/files/'+id,{credentials:'same-origin'});if(!r.ok)throw Error('Unable to download file');const b=await r.blob();const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}catch(e){alert(e.message)}}
function closeModal(){$('requestModal').classList.remove('open')};function backdrop(e){if(e.target.id==='requestModal')closeModal()}
navSetup();$('loginPassword').addEventListener('keydown',e=>{if(e.key==='Enter')adminLogin()});
</script>
<script>
(function(){
  var hamb=document.querySelector('.hamb'); if(!hamb) return;
  var back=document.createElement('div'); back.className='side-backdrop'; document.body.appendChild(back);
  function close(){document.body.classList.remove('nav-open');}
  hamb.addEventListener('click',function(){document.body.classList.toggle('nav-open');});
  back.addEventListener('click',close);
  document.addEventListener('click',function(e){ if(e.target.closest && e.target.closest('.side .nav')) close(); });
  window.addEventListener('resize',function(){ if(window.innerWidth>800) close(); });
})();
</script>
</body></html>
