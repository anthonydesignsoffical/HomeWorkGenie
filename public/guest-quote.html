<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Homework Genie | Your Quote</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet"><style>body{margin:0;background:#160d1b;color:#fff;font-family:'Nunito Sans',sans-serif}.wrap{max-width:760px;margin:60px auto;padding:24px}.card{background:#fff;color:#251b2d;border-radius:20px;padding:30px;box-shadow:0 30px 80px #0005}.brand{font-family:Fredoka;font-size:24px;margin-bottom:25px}.brand img{width:150px;height:86px;object-fit:contain}.muted{color:#777}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.box{background:#faf8fc;border-radius:12px;padding:15px}.box b{display:block;font-size:11px;color:#8b8390;text-transform:uppercase;margin-bottom:5px}.total{font-size:32px;font-weight:800;margin:20px 0}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:12px 18px;font-weight:800;cursor:pointer}.primary{background:#d6a83a;color:#1d1422}.outline{background:#fff;border:1px solid #ddd;color:#4a3b52}.success{background:#e9fff4;padding:12px;border-radius:10px;color:#087c54;display:none;margin:15px 0}.error{background:#fff0f0;padding:12px;border-radius:10px;color:#b42318;display:none;margin:15px 0}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.modal .card{width:min(440px,92vw)}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;box-sizing:border-box;margin:6px 0 12px}@media(max-width:600px){.grid{grid-template-columns:1fr}.wrap{margin:20px auto}}
</style></head><body><div class="wrap"><div class="brand"><img src="/assets/homework-genie-logo-transparent.png" alt="Homework Genie"></div><div id="loading" class="card">Loading your quote…</div><div id="quote" class="card" style="display:none"></div></div><div id="claimModal" class="modal"><div class="card"><h2 style="font-family:Fredoka">Create your Homework Genie account</h2><p class="muted">Your accepted quote will be linked to your new client account.</p><label>Name</label><input id="claimName"><label>Phone</label><input id="claimPhone"><label>Email</label><input id="claimEmail" readonly><label>Password</label><input id="claimPassword" type="password" placeholder="10+ characters, letters and numbers"><div id="claimError" class="error"></div><div class="actions"><button class="btn outline" onclick="closeClaim()">Cancel</button><button class="btn primary" onclick="claim()">Create Account</button></div></div></div><script>const token=new URLSearchParams(location.search).get('token');let quoteData=null;const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}async function api(p,o={}){const r=await fetch('/api'+p,{credentials:'same-origin',...o,headers:{'Content-Type':'application/json',...(o.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function load(){try{if(!token)throw Error('Missing quote link token.');const d=await api('/guest/quotes/'+encodeURIComponent(token));quoteData=d.quote;$('loading').style.display='none';$('quote').style.display='block';$('quote').innerHTML=`<h1 style="font-family:Fredoka">Your personalized quote</h1><p class="muted">Quote ${esc(quoteData.quoteNumber)} • Issued ${new Date(quoteData.dateIssued).toLocaleDateString()}</p><div class="grid"><div class="box"><b>Service</b>${esc(quoteData.service)}</div><div class="box"><b>Subject</b>${esc(quoteData.subject)}</div><div class="box"><b>Assignment</b>${esc(quoteData.title)}</div><div class="box"><b>Deadline</b>${esc(quoteData.deadline)}</div></div><p>${esc(quoteData.description)}</p><div class="total">$${Number(quoteData.price||0).toFixed(2)}</div><p class="muted">${esc(quoteData.terms||'')}</p><div id="msg" class="success"></div><div class="actions" id="actions"></div>`;if(quoteData.status==='accepted'){$('actions').innerHTML='<button class="btn primary" onclick="openClaim()">Create my account</button>'}else{$('actions').innerHTML='<button class="btn primary" onclick="respond(\'accepted\')">Accept Quote</button><button class="btn outline" onclick="respond(\'changes_requested\')">Request Changes</button><button class="btn outline" onclick="respond(\'declined\')">Decline</button>'}}catch(e){$('loading').textContent=e.message}}async function respond(action){const note=action==='changes_requested'?prompt('What would you like changed?')||'':'';try{const d=await api('/guest/quotes/'+encodeURIComponent(token)+'/respond',{method:'POST',body:JSON.stringify({action,note})});const m=$('msg');m.textContent=action==='accepted'?'Quote accepted. You can now create your client account.':'Your response has been recorded.';m.style.display='block';await load()}catch(e){alert(e.message)}}function openClaim(){$('claimEmail').value=quoteData.student.email||'';$('claimName').value=quoteData.student.name||'';$('claimPhone').value=quoteData.student.phone||'';$('claimModal').classList.add('open')}function closeClaim(){$('claimModal').classList.remove('open')}async function claim(){const e=$('claimError');e.style.display='none';try{const d=await api('/guest/quotes/'+encodeURIComponent(token)+'/claim',{method:'POST',body:JSON.stringify({name:$('claimName').value,phone:$('claimPhone').value,email:$('claimEmail').value,password:$('claimPassword').value})});e.className='success';e.textContent='Account created. Redirecting…';e.style.display='block';setTimeout(()=>location.href='/',900)}catch(x){e.textContent=x.message;e.style.display='block'}}load();</script></body></html>
