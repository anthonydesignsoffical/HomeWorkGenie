<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Reset Password | Homework Genie</title>
  <style>
    :root{--plum:#4b2670;--plum-dark:#2a123e;--gold:#d7b35b;--cream:#fff8e8;--text:#24162d;--muted:#75677d;--border:#eadff0}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#f8f1fb,#fffaf0);color:var(--text);display:flex;align-items:center;justify-content:center;padding:24px}
    .card{width:min(460px,100%);background:#fff;border:1px solid var(--border);border-radius:24px;box-shadow:0 20px 60px rgba(50,24,70,.14);padding:34px}
    .brand{display:flex;align-items:center;gap:14px;margin-bottom:26px}.brand img{width:58px;height:58px;object-fit:contain;border-radius:14px}.brand strong{display:block;font-size:22px;color:var(--plum)}.brand span{font-size:13px;color:var(--muted)}
    h1{margin:0 0 8px;font-size:28px;color:var(--plum)}.subtitle{margin:0 0 24px;color:var(--muted);line-height:1.6}
    label{display:block;font-weight:700;font-size:14px;margin:0 0 8px}.field{margin-bottom:18px}.password-wrap{position:relative}.password-wrap input{padding-right:48px}input{width:100%;padding:13px 14px;border:1px solid #d9cde0;border-radius:12px;font-size:15px;outline:none;background:#fff}input:focus{border-color:var(--plum);box-shadow:0 0 0 3px rgba(75,38,112,.1)}
    .toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;cursor:pointer;color:var(--plum);font-weight:700}.btn{width:100%;border:0;border-radius:12px;padding:14px 18px;font-weight:800;font-size:15px;cursor:pointer;background:var(--plum);color:#fff}.btn:hover{background:var(--plum-dark)}
    .message{display:none;margin-top:16px;padding:12px 14px;border-radius:10px;line-height:1.5;font-size:14px}.message.error{display:block;background:#fff0f0;color:#a33;border:1px solid #f0caca}.message.success{display:block;background:#f1fbf4;color:#17633a;border:1px solid #ccebd8}
    .back{display:block;text-align:center;margin-top:20px;color:var(--plum);text-decoration:none;font-weight:700}.loading{opacity:.65;pointer-events:none}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <img src="/assets/homework-genie-logo-transparent.png" alt="Homework Genie logo">
      <div><strong>Homework Genie</strong><span>Academic support made simple</span></div>
    </div>
    <section id="formView">
      <h1>Reset your password</h1>
      <p class="subtitle">Choose a new password for your Homework Genie student account.</p>
      <form id="resetForm">
        <div class="field"><label for="password">New password</label><div class="password-wrap"><input id="password" type="password" autocomplete="new-password" required><button class="toggle" type="button" data-target="password">Show</button></div></div>
        <div class="field"><label for="confirm">Confirm new password</label><div class="password-wrap"><input id="confirm" type="password" autocomplete="new-password" required><button class="toggle" type="button" data-target="confirm">Show</button></div></div>
        <button class="btn" id="submitBtn" type="submit">Update Password</button>
        <div id="message" class="message"></div>
      </form>
    </section>
    <a class="back" href="/">Back to Homework Genie</a>
  </main>
  <script>
    const token=new URLSearchParams(location.search).get('token')||'';
    const form=document.getElementById('resetForm'), msg=document.getElementById('message'), btn=document.getElementById('submitBtn');
    function show(text,type){msg.textContent=text;msg.className='message '+type}
    document.querySelectorAll('.toggle').forEach(b=>b.addEventListener('click',()=>{const i=document.getElementById(b.dataset.target);const show=i.type==='password';i.type=show?'text':'password';b.textContent=show?'Hide':'Show';}));
    if(!token){btn.disabled=true;show('This password reset link is missing its security token. Please request a new reset email.','error')}
    form.addEventListener('submit',async e=>{
      e.preventDefault();
      const password=document.getElementById('password').value;const confirm=document.getElementById('confirm').value;
      if(password!==confirm)return show('Passwords do not match.','error');
      if(password.length<10 || !/[A-Za-z]/.test(password) || !/[0-9]/.test(password))return show('Password must be at least 10 characters and include a letter and a number.','error');
      btn.classList.add('loading');btn.textContent='Updating…';msg.className='message';
      try{
        const res=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password})});
        const data=await res.json().catch(()=>({}));
        if(!res.ok)throw new Error(data.error||'Unable to reset your password.');
        show('Your password has been updated successfully. You can now log in.','success');
        form.querySelectorAll('input').forEach(i=>i.disabled=true);btn.disabled=true;btn.textContent='Password Updated';
        setTimeout(()=>location.href='/?login=1',1400);
      }catch(err){btn.classList.remove('loading');btn.textContent='Update Password';show(err.message,'error')}
    });
  </script>
</body>
</html>
